    <style>
        /* =====================================================================
           VARIÁVEIS E AJUSTES DE LAYOUT DO PORTAL ÚNICO
           ===================================================================== */
        :root {
            --primary: #00d4ff;
            --gold-main: #f5c451;
            --gold-border: rgba(245, 196, 81, 0.65);
            --gold-glow: rgba(245, 180, 40, 0.25);
        }

        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .hidden-view {
            display: none !important;
        }

        /* Área principal de navegação em Grade / Carrossel */
        .portal-main-stage {
            position: relative;
            min-height: 100vh;
            width: 100%;
            padding: 96px 28px 80px 28px;
            box-sizing: border-box;
            background-image: linear-gradient(rgba(3, 8, 20, 0.82), rgba(5, 14, 32, 0.76)), url('img/Capa_Base_dados.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: scroll;
        }

        /* Barra de navegação interna (Breadcrumb + Botão Voltar) */
        .portal-nav-bar {
            max-width: 1520px;
            margin: 0 auto 22px auto;
            padding: 14px 20px;
            border-radius: 14px;
            background: rgba(8, 16, 34, 0.78);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 212, 255, 0.28);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .portal-nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-portal-voltar {
            background: rgba(0, 212, 255, 0.14);
            border: 1px solid rgba(0, 212, 255, 0.45);
            color: #fff;
            padding: 8px 14px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s ease;
        }

        .btn-portal-voltar:hover {
            background: var(--primary);
            color: #030712;
        }

        .portal-breadcrumb {
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .portal-breadcrumb span.atual {
            color: var(--primary);
            font-weight: 800;
        }

        /* Grade de Cards do Portal */
        .portal-cards-grid {
            max-width: 1520px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
            gap: 20px;
        }

        /* Card padrão com espaço reservado para imagem */
        .p-card {
            background: rgba(10, 19, 38, 0.76);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 212, 255, 0.26);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 255px;
            cursor: pointer;
            transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        }

        .p-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
        }

        /* Estilo Dourado para o Card 5. GERÊNCIA e seus sub-níveis */
        .p-card.card-gold {
            background: linear-gradient(155deg, rgba(245, 196, 81, 0.16) 0%, rgba(28, 22, 10, 0.82) 100%);
            border: 1.5px solid var(--gold-border);
            box-shadow: 0 10px 26px var(--gold-glow);
        }

        .p-card.card-gold:hover {
            border-color: var(--gold-main);
            box-shadow: 0 14px 32px rgba(245, 196, 81, 0.42);
        }

        .p-card.card-gold .p-card-title {
            color: #fde68a;
        }

        .p-card.card-gold .p-card-img-box {
            border-color: rgba(245, 196, 81, 0.5);
        }

        /* Espaço reservado para imagens (quando vazio, mostra placeholder) */
        .p-card-img-box {
            width: 100%;
            height: 112px;
            border-radius: 10px;
            background: rgba(3, 8, 20, 0.65);
            border: 1px dashed rgba(148, 163, 184, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 14px;
            color: #94a3b8;
            font-size: 11px;
            text-align: center;
            padding: 6px;
        }

        .p-card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .p-card-title {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            margin: 0 0 6px 0;
            letter-spacing: 0.4px;
        }

        .p-card-desc {
            font-size: 11px;
            color: #94a3b8;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        .p-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--primary);
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .p-card.card-gold .p-card-footer {
            color: var(--gold-main);
        }

        /* =====================================================================
           VISUALIZADOR DE DASHBOARD / PLANILHA (IFRAME)
           ===================================================================== */
        .viewer-box {
            max-width: 1520px;
            margin: 0 auto;
            background: rgba(8, 16, 34, 0.85);
            border: 1px solid rgba(0, 212, 255, 0.35);
            border-radius: 16px;
            padding: 16px;
        }

        .viewer-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .viewer-frame-wrap {
            width: 100%;
            height: 76vh;
            border-radius: 10px;
            overflow: hidden;
            background: #050a14;
        }

        /* =====================================================================
           PÁGINA ORGANOGRAMA (CLARIDADE AJUSTADA + FUNDO MOBILE CORRIGIDO)
           ===================================================================== */
        .org-section-box {
            max-width: 1520px;
            margin: 0 auto;
            min-height: 78vh;
            border-radius: 18px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            /* Fundo mais claro (camada reduzida de 0.84 para 0.42) */
            background-image: linear-gradient(rgba(3, 8, 20, 0.42), rgba(5, 14, 32, 0.36)), url('img/estrutura.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: scroll;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        /* Garante que no mobile a imagem ocupe a tela sem cortar ao meio */
        @media (max-width: 768px) {
            .portal-main-stage {
                padding: 82px 14px 76px 14px;
            }
            .org-section-box {
                min-height: 100vh;
                padding: 16px 10px;
                background-attachment: scroll;
                background-size: cover;
            }
        }
    </style>
</head>

            const iframeTitulo = document.getElementById("iframeTitulo");
            const iframeLinkExterno = document.getElementById("iframeLinkExterno");
            const searchInput = document.getElementById("portalSearchInput");

            // =================================================================
            // RENDERIZAÇÃO DOS CARDS
            // =================================================================
            function desenharCards(filtroTexto = "") {
                iframeViewerView.classList.add("hidden-view");
                organogramaView.classList.add("hidden-view");
                cardsGridView.classList.remove("hidden-view");

                const termo = filtroTexto.trim().toLowerCase();
                const itensFiltrados = termo
                    ? listaAtual.filter(item =>
                        item.titulo.toLowerCase().includes(termo) ||
                        (item.descricao && item.descricao.toLowerCase().includes(termo))
                    )
                    : listaAtual;

                cardsGridView.innerHTML = "";

                itensFiltrados.forEach(item => {
                    const card = document.createElement("div");
                    card.className = `p-card ${item.dourado ? "card-gold" : ""}`;

                    // Espaço reservado para imagem: mostra imagem se preenchida ou placeholder
                    const blocoImagem = item.imagem
                        ? `<img src="${item.imagem}" alt="${item.titulo}">`
                        : `<span>🖼️ Espaço reservado para imagem</span>`;

                    let acaoTexto = "Abrir";
                    if (item.filhos && item.filhos.length) acaoTexto = `${item.filhos.length} itens`;
                    else if (item.tipoEspecial === "organograma") acaoTexto = "Ver Organograma";
                    else if (item.linkExterno && item.linkExterno !== "#") acaoTexto = "Abrir Planilha";
                    else if (item.embed) acaoTexto = "Abrir Dashboard";
                    else acaoTexto = "Pendente";

                    card.innerHTML = `
                        <div>
                            <div class="p-card-img-box">${blocoImagem}</div>
                            <h3 class="p-card-title">${item.titulo}</h3>
                            <p class="p-card-desc">${item.descricao || "Espaço reservado para descrição e imagem futura."}</p>
                        </div>
                        <div class="p-card-footer">
                            <span>${acaoTexto}</span>
                            <i class="fa-solid fa-chevron-right"></i>
                        </div>
                    `;

                    card.addEventListener("click", () => aoClicarNoCard(item));
                    cardsGridView.appendChild(card);
                });

                atualizarTrilha(itensFiltrados.length);
            }

            // =================================================================
            // NAVEGAÇÃO AO CLICAR EM UM CARD
            // =================================================================
            function aoClicarNoCard(item) {
                // Se tiver sub-cards, avança na hierarquia
                if (item.filhos && item.filhos.length > 0) {
                    pilhaHistorico.push({
                        nome: rotaAtualNome,
                        itens: listaAtual
                    });
                    listaAtual = item.filhos;
                    rotaAtualNome = item.titulo;
                    searchInput.value = "";
                    desenharCards();
                    return;
                }

                // Se for o card Organograma
                if (item.tipoEspecial === "organograma") {
                    pilhaHistorico.push({
                        nome: rotaAtualNome,
                        itens: listaAtual
                    });
                    rotaAtualNome = item.titulo;
                    abrirSecaoOrganograma();
                    return;
                }

                // Se for link externo de planilha (Banco de Dados)
                if (item.linkExterno && item.linkExterno !== "#") {
                    window.open(item.linkExterno, "_blank");
                    return;
                }

                // Se tiver embed do Looker Studio, abre no iframe integrado
                if (item.embed) {
                    cardsGridView.classList.add("hidden-view");
                    organogramaView.classList.add("hidden-view");
                    iframeViewerView.classList.remove("hidden-view");
                    iframeTitulo.textContent = item.titulo;
                    iframeLinkExterno.href = item.embed;
                    portalIframe.src = item.embed;
                    return;
                }

                alert(`"${item.titulo}" está estruturado e aguardando link/imagem.`);
            }

            // =================================================================
            // SEÇÃO ORGANOGRAMA INTEGRADA
            // =================================================================
            function abrirSecaoOrganograma() {
                cardsGridView.classList.add("hidden-view");
                iframeViewerView.classList.add("hidden-view");
                organogramaView.classList.remove("hidden-view");
                btnVoltarNivel.classList.remove("hidden-view");
                breadcrumbTrilha.innerHTML = `Home / <span class="atual">4. ORGANOGRAMA</span>`;

                organogramaCardsResumo.innerHTML = `
                    <div class="p-card card-gold">
                        <div class="p-card-img-box"><span>🖼️ Foto / Imagem Liderança</span></div>
                        <h3 class="p-card-title">GERÊNCIA DE CONTRATO</h3>
                        <p class="p-card-desc">Gestão executiva do contrato e direcionamento estratégico.</p>
                        <div class="p-card-footer"><span>Nível 1</span><i class="fa-solid fa-crown"></i></div>
                    </div>
                    <div class="p-card">
                        <div class="p-card-img-box"><span>🖼️ Foto / Imagem Liderança</span></div>
                        <h3 class="p-card-title">GERÊNCIA OPERACIONAL</h3>
                        <p class="p-card-desc">Supervisão geral das operações e eficiência de campo.</p>
                        <div class="p-card-footer"><span>Nível 2</span><i class="fa-solid fa-sitemap"></i></div>
                    </div>
                    <div class="p-card">
                        <div class="p-card-img-box"><span>🖼️ Foto / Imagem Liderança</span></div>
                        <h3 class="p-card-title">COORDENAÇÃO OPERACIONAL</h3>
                        <p class="p-card-desc">Coordenação das frentes de serviço e planejamento diário.</p>
                        <div class="p-card-footer"><span>Nível 3</span><i class="fa-solid fa-users"></i></div>
                    </div>
                `;
            }

            // =================================================================
            // TRILHA DE NAVEGAÇÃO, VOLTAR E MENU SUPERIOR
            // =================================================================
            function atualizarTrilha(qtd) {
                if (pilhaHistorico.length === 0) {
                    btnVoltarNivel.classList.add("hidden-view");
                    breadcrumbTrilha.innerHTML = `Home / <span class="atual">Início</span>`;
                } else {
                    btnVoltarNivel.classList.remove("hidden-view");
                    const caminho = pilhaHistorico.map(p => p.nome).join(" / ");
                    breadcrumbTrilha.innerHTML = `${caminho} / <span class="atual">${rotaAtualNome}</span>`;
                }
                contadorItens.textContent = `${qtd} card(s) exibido(s)`;
            }

            function voltarParaHome() {
                pilhaHistorico = [];
                listaAtual = ARVORE_PORTAL.home;
                rotaAtualNome = "Início";
                searchInput.value = "";
                portalIframe.src = "";
                desenharCards();
            }

            btnVoltarNivel.addEventListener("click", () => {
                if (!iframeViewerView.classList.contains("hidden-view")) {
                    portalIframe.src = "";
                    desenharCards();
                    return;
                }

                if (pilhaHistorico.length > 0) {
                    const anterior = pilhaHistorico.pop();
                    listaAtual = anterior.itens;
                    rotaAtualNome = anterior.nome;
                    desenharCards();
                } else {
                    voltarParaHome();
                }
            });

            document.getElementById("btnFecharIframe").addEventListener("click", () => {
                portalIframe.src = "";
                desenharCards();
            });

            document.getElementById("btnVoltarOrganogramaHome").addEventListener("click", voltarParaHome);
            document.getElementById("logoHomeLink").addEventListener("click", (e) => {
                e.preventDefault();
                voltarParaHome();
            });
            document.getElementById("btnTopoMobile").addEventListener("click", voltarParaHome);

            // Atalhos diretos da Navbar para cada seção principal
            document.querySelectorAll("[data-nav]").forEach(btn => {
                btn.addEventListener("click", () => {
                    const destino = btn.getAttribute("data-nav");
                    document.querySelectorAll("[data-nav]").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");

                    voltarParaHome();
                    if (destino === "home") return;

                    const cardAlvo = ARVORE_PORTAL.home.find(c => c.id === destino);
                    if (cardAlvo) aoClicarNoCard(cardAlvo);
                });
            });

            searchInput.addEventListener("input", (e) => {
                desenharCards(e.target.value);
            });

            // Inicializa o portal exibindo os cards da Home
            desenharCards();
        })();
    </script>
</body>

</html>
