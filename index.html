<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELLCA | ACESSO AO SISTEMA</title>

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Unificado -->
    <link rel="stylesheet" href="styles_index.css">

    <!-- Estilos Exclusivos da Tela de Capa -->
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            overflow: hidden;
            background: #02050a;
        }

        .capa-bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 50% 45%, rgba(0, 212, 255, 0.14) 0%, rgba(10, 32, 74, 0.35) 45%, rgba(2, 5, 10, 0.94) 100%),
                url('img/Capa_home.jpg') center / cover no-repeat;
            z-index: 0;
            transform: scale(1.03);
            animation: capaZoom 18s ease-in-out infinite alternate;
        }

        @keyframes capaZoom {
            0% { transform: scale(1.02); }
            100% { transform: scale(1.07); }
        }

        .capa-grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.045) 1px, transparent 1px);
            background-size: 46px 46px;
            mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.85) 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.85) 20%, transparent 80%);
            z-index: 1;
            pointer-events: none;
        }

        .capa-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 36px 28px;
            max-width: 680px;
            width: 92%;
            transition: opacity 0.38s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), filter 0.38s ease;
        }

        .capa-wrapper.saindo {
            opacity: 0;
            transform: scale(1.06);
            filter: blur(8px);
        }

        .capa-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.4px;
            color: var(--primary);
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .capa-logo-box {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
        }

        .capa-logo-box::before {
            content: '';
            position: absolute;
            width: 175px;
            height: 175px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.34) 0%, rgba(0, 85, 255, 0.12) 55%, transparent 75%);
            filter: blur(14px);
            animation: logoHaloPulse 3.5s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes logoHaloPulse {
            0%, 100% { transform: scale(0.95); opacity: 0.75; }
            50% { transform: scale(1.12); opacity: 1; }
        }

        .capa-logo {
            height: 92px;
            width: auto;
            display: block;
            filter: drop-shadow(0 0 18px rgba(0, 212, 255, 0.45));
        }

        .capa-title {
            font-size: clamp(28px, 4.4vw, 48px) !important;
            font-weight: 900;
            line-height: 1.12;
            letter-spacing: 1px;
            margin-bottom: 14px;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
        }

        .capa-subtitle {
            font-size: clamp(12px, 1.1vw, 14px);
            color: #cbd5e1;
            line-height: 1.6;
            max-width: 500px;
            margin-bottom: 30px;
        }

        .btn-iniciar {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 38px;
            border-radius: 50px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.22) 0%, rgba(0, 142, 191, 0.48) 100%);
            border: 1.5px solid var(--primary);
            color: #ffffff !important;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow:
                0 0 24px rgba(0, 212, 255, 0.38),
                inset 0 0 12px rgba(0, 212, 255, 0.28);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer;
        }

        .btn-iniciar:hover {
            background: var(--primary);
            border-color: #ffffff;
            color: #02060f !important;
            transform: translateY(-3px) scale(1.04);
            box-shadow:
                0 0 34px var(--primary),
                0 0 12px rgba(255, 255, 255, 0.9);
        }

        .btn-iniciar:active {
            transform: scale(0.97);
        }

        .capa-hint {
            margin-top: 16px;
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.52);
            letter-spacing: 0.6px;
        }

        .capa-hint strong {
            color: var(--primary);
            font-weight: 700;
        }

        .version-tag {
            margin-top: 34px;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 1.8px;
            color: rgba(255, 255, 255, 0.36);
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .capa-logo {
                height: 74px;
            }

            .capa-status-pill {
                font-size: 8.5px;
                padding: 5px 12px;
            }

            .btn-iniciar {
                padding: 13px 32px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="capa-bg"></div>
    <div class="capa-grid-overlay"></div>

    <div class="capa-wrapper" id="capaWrapper">
        <!-- Badge de Status Superior -->
        <div class="capa-status-pill">
            <span class="pulse-dot"></span>
            <span>AMBIENTE OPERACIONAL • CONEXÃO SEGURA</span>
        </div>

        <!-- Logo animada com halo de luz -->
        <div class="capa-logo-box">
            <img src="img/logo_ellca.png" alt="Logo ELLCA" class="capa-logo">
        </div>
        
        <!-- Título com efeito neon herdado -->
        <h1 class="capa-title title">
            SISTEMA DE <br><span>CONTROLE GERENCIAL</span>
        </h1>
        
        <p class="capa-subtitle">
            Plataforma integrada de indicadores operacionais, planilhas inteligentes e dashboards analíticos.
        </p>
        
        <!-- Botão que direciona para a página principal -->
        <a href="login.html" class="btn-iniciar" id="btnIniciar">
            <span>INICIAR</span>
            <i class="fa-solid fa-power-off"></i>
        </a>

        <span class="capa-hint">Pressione <strong>ENTER</strong> ou clique para acessar</span>

        <!-- Rodapé simples de sistema -->
        <div class="version-tag">ELLCA V2.5.0 • ACESSO RESTRITO</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnIniciar = document.getElementById('btnIniciar');
            const capaWrapper = document.getElementById('capaWrapper');

            function entrarNoSistema(e) {
                if (e) e.preventDefault();
                if (!capaWrapper || !btnIniciar) {
                    window.location.href = 'home.html';
                    return;
                }
                capaWrapper.classList.add('saindo');
                setTimeout(() => {
                    window.location.href = btnIniciar.getAttribute('href');
                }, 380);
            }

            if (btnIniciar) {
                btnIniciar.addEventListener('click', entrarNoSistema);
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    entrarNoSistema(e);
                }
            });
        });
    </script>

</body>
</html>
