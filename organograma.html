<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELLCA | ESTRUTURA ORGANIZACIONAL</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles_index.css">

    <style>
        :root {
            --primary: #00d4ff;
            --gold-border: rgba(245, 196, 81, 0.55);
            --gold-glow: rgba(245, 180, 40, 0.22);
            --silver-border: rgba(203, 213, 225, 0.55);
            --silver-glow: rgba(226, 232, 240, 0.20);
            --bronze-border: rgba(205, 127, 50, 0.55);
            --bronze-glow: rgba(205, 127, 50, 0.22);
        }

        /* ================= CORREÇÃO DE SCROLL NO DESKTOP E MOBILE ================= */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-y: auto !important;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        /* Trava scroll quando o modo "Ajustar à Tela" estiver ativo */
        body.fit-screen-mode {
            overflow: hidden !important;
        }

        .desktop-view {
            min-height: 100vh;
            height: auto !important;
            overflow: visible !important;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            height: auto !important;
            min-height: 100vh;
            overflow: visible !important;
            position: relative;
        }

        .container .item.active {
            position: relative !important;
            height: auto !important;
            min-height: 100vh;
            overflow: visible !important;
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }

        /* ================= NAVBAR E RODAPÉ ENCOLHIDOS ================= */
        .navbar,
        .footer-bar {
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s ease;
        }

        body.bars-collapsed .navbar {
            transform: translateY(-110%);
            opacity: 0;
            pointer-events: none;
        }

        body.bars-collapsed .footer-bar {
            transform: translateY(110%);
            opacity: 0;
            pointer-events: none;
        }

        /* Barra de rolagem estilizada e visível */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(3, 7, 18, 0.85);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.45);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.8);
        }

        .org-wrapper {
            width: 100%;
            max-width: 1520px;
            margin: 0 auto;
            padding: 95px 24px 85px 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 22px;
            transition: padding 0.32s ease;
        }

        /* Reduz margens quando navbar e rodapé estão encolhidos */
        body.bars-collapsed .org-wrapper {
            padding: 18px 24px 24px 24px;
        }

        body.fit-screen-mode .org-wrapper {
            max-width: 100%;
            height: 100vh;
            padding-bottom: 14px;
            gap: 14px;
            overflow: hidden;
        }

        /* CABEÇALHO DA PÁGINA */
        .org-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 14px 22px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(4, 9, 20, 0.78) 0%, rgba(12, 36, 84, 0.65) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 212, 255, 0.32);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
            flex-shrink: 0;
            z-index: 10;
        }

        .org-title-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .org-icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(0, 212, 255, 0.14);
            border: 1px solid rgba(0, 212, 255, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 18px;
            flex-shrink: 0;
        }

        .org-title-group h1 {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 1.2px;
            color: #fff;
            margin: 0;
            text-transform: uppercase;
        }

        .org-title-group p {
            font-size: 11px;
            color: #94a3b8;
            margin: 3px 0 0 0;
        }

        .org-header-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-org-control {
            padding: 9px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0, 212, 255, 0.42);
            background: rgba(0, 212, 255, 0.12);
            color: #e2e8f0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.25s ease;
        }

        .btn-org-control:hover {
            background: rgba(0, 212, 255, 0.26);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 14px rgba(0, 212, 255, 0.35);
        }

        .btn-org-control.active-mode {
            background: var(--primary);
            color: #030712;
            border-color: var(--primary);
            box-shadow: 0 0 18px rgba(0, 212, 255, 0.45);
        }

        /* PALCO DO ORGANOGRAMA (PERMITE ESCALA PROPORCIONAL) */
        .org-stage {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        body.fit-screen-mode .org-stage {
            flex: 1;
            align-items: center;
            overflow: hidden;
        }

        #organogramaContainer {
            width: 100%;
            display: flex;
            justify-content: center;
            transform-origin: center center;
            transition: transform 0.25s ease;
        }

        /* ÁRVORE DO ORGANOGRAMA */
        .org-tree {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeInOrg 0.35s ease;
        }

        .org-level {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            position: relative;
        }

        /* Modos de disposição dos líderes no modo Ajustar à Tela */
        .org-tree.fit-single-row {
            width: max-content;
        }
        .org-tree.fit-single-row .org-level {
            flex-wrap: nowrap;
            width: max-content;
        }
        .org-tree.fit-single-row .org-connector-bar {
            width: 94%;
            max-width: none;
        }

        .org-tree.fit-two-rows {
            width: 1620px;
        }
        .org-tree.fit-two-rows .org-level {
            flex-wrap: wrap;
            width: 1620px;
        }
        .org-tree.fit-two-rows .org-connector-bar {
            width: 92%;
            max-width: none;
        }

        @keyframes fadeInOrg {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= CONECTORES LUMINOSOS COM PULSO DE ENERGIA ================= */
        .org-connector-v {
            width: 2px;
            height: 26px;
            background: rgba(0, 212, 255, 0.24);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.35);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .org-connector-v::after {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, transparent, #ffffff, var(--primary), transparent);
            animation: pulseVertical 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes pulseVertical {
            0% { top: -100%; }
            100% { top: 120%; }
        }

        .org-connector-bar {
            width: 86%;
            max-width: 1280px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.28) 15%, rgba(0, 212, 255, 0.28) 85%, transparent);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        .org-connector-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -35%;
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.85), #ffffff, rgba(0, 212, 255, 0.85), transparent);
            box-shadow: 0 0 14px #00d4ff;
            animation: pulseHorizontal 3.4s ease-in-out infinite;
        }

        @keyframes pulseHorizontal {
            0% { left: -35%; }
            50% { left: 100%; }
            100% { left: -35%; }
        }

        /* ================= CARD PROPORCIONAL COM TRAÇO SEQUENCIAL VAI-E-VOLTA ================= */
        .org-card {
            --stroke-color: #00d4ff;
            width: 248px;
            min-height: 266px;
            padding: 18px 16px 15px 16px;
            border-radius: 16px;
            background: rgba(8, 15, 30, 0.56);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 212, 255, 0.24);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.48);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .org-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 212, 255, 0.65);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.65);
        }

        .card-border-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: visible;
        }

        .card-border-rect {
            fill: none;
            stroke: var(--stroke-color);
            stroke-width: 1.15;
            stroke-linecap: round;
            pathLength: 100;
            stroke-dasharray: 28 100;
            stroke-dashoffset: 128;
            opacity: 0;
            filter: drop-shadow(0 0 3.5px var(--stroke-color));
            transition: opacity 0.12s ease;
        }

        .org-card.active-trace .card-border-rect {
            opacity: 1;
        }

        .org-card-top,
        .org-card-bottom {
            position: relative;
            z-index: 1;
        }

        .org-card-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .org-card-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 12px;
        }

        /* ================= EFEITO VIDRO METÁLICO SUTIL: OURO, PRATA E BRONZE ================= */
        .org-card.tier-gold {
            --stroke-color: #fcd34d;
            width: 274px;
            min-height: 278px;
            background: linear-gradient(155deg, rgba(245, 190, 65, 0.15) 0%, rgba(28, 22, 10, 0.58) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--gold-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 230, 150, 0.26);
        }
        .org-card.tier-gold:hover {
            border-color: rgba(252, 211, 77, 0.85);
            box-shadow: 0 16px 36px var(--gold-glow), inset 0 1px 0 rgba(255, 236, 179, 0.38);
        }
        .tier-gold .org-badge {
            background: rgba(245, 190, 65, 0.16);
            border-color: rgba(245, 190, 65, 0.45);
            color: #fde68a;
        }
        .tier-gold .org-avatar {
            border-color: rgba(245, 190, 65, 0.75);
            box-shadow: 0 0 14px rgba(245, 190, 65, 0.24);
        }

        .org-card.tier-silver {
            --stroke-color: #f1f5f9;
            width: 266px;
            min-height: 272px;
            background: linear-gradient(155deg, rgba(226, 232, 240, 0.15) 0%, rgba(20, 27, 38, 0.58) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--silver-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(248, 250, 252, 0.26);
        }
        .org-card.tier-silver:hover {
            border-color: rgba(241, 245, 249, 0.85);
            box-shadow: 0 16px 36px var(--silver-glow), inset 0 1px 0 rgba(255, 255, 255, 0.38);
        }
        .tier-silver .org-badge {
            background: rgba(226, 232, 240, 0.15);
            border-color: rgba(203, 213, 225, 0.45);
            color: #e2e8f0;
        }
        .tier-silver .org-avatar {
            border-color: rgba(226, 232, 240, 0.75);
            box-shadow: 0 0 14px rgba(226, 232, 240, 0.20);
        }

        .org-card.tier-bronze {
            --stroke-color: #fdba74;
            width: 258px;
            min-height: 268px;
            background: linear-gradient(155deg, rgba(205, 127, 50, 0.15) 0%, rgba(30, 19, 12, 0.58) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--bronze-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(244, 184, 134, 0.24);
        }
        .org-card.tier-bronze:hover {
            border-color: rgba(234, 159, 90, 0.85);
            box-shadow: 0 16px 36px var(--bronze-glow), inset 0 1px 0 rgba(244, 184, 134, 0.36);
        }
        .tier-bronze .org-badge {
            background: rgba(205, 127, 50, 0.16);
            border-color: rgba(205, 127, 50, 0.45);
            color: #fdba74;
        }
        .tier-bronze .org-avatar {
            border-color: rgba(217, 140, 68, 0.75);
            box-shadow: 0 0 14px rgba(205, 127, 50, 0.22);
        }

        /* ELEMENTOS INTERNOS DO CARD */
        .org-badge {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            padding: 3.5px 10px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.14);
            border: 1px solid rgba(0, 212, 255, 0.35);
            color: #7dd3fc;
            margin-bottom: 11px;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .org-avatar {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 212, 255, 0.55);
            background: rgba(15, 23, 42, 0.85);
            margin-bottom: 10px;
        }

        .org-name {
            font-size: 13.5px;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 3px 0;
            line-height: 1.25;
        }

        .org-role {
            font-size: 11px;
            font-weight: 700;
            color: #cbd5e1;
            margin: 0 0 8px 0;
            line-height: 1.3;
        }

        .org-desc {
            font-size: 10.5px;
            line-height: 1.42;
            color: #94a3b8;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* BOTÕES WHATSAPP E E-MAIL */
        .org-contact-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-contact {
            flex: 1;
            padding: 7px 8px;
            border-radius: 8px;
            font-size: 10.5px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn-contact.wpp {
            background: rgba(34, 197, 94, 0.14);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
        }
        .btn-contact.wpp:hover {
            background: #22c55e;
            color: #052e16;
        }

        .btn-contact.mail {
            background: rgba(0, 212, 255, 0.14);
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: #7dd3fc;
        }
        .btn-contact.mail:hover {
            background: var(--primary);
            color: #082f49;
        }

        .card-footer-actions {
            margin-top: 9px;
            padding-top: 8px;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .btn-card-action {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .btn-card-action:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-card-action.equipe-btn {
            color: var(--primary);
        }
        .btn-card-action.equipe-btn:hover {
            background: rgba(0, 212, 255, 0.15);
            color: #7dd3fc;
        }

        /* ================= MODAL PERFIL INDIVIDUAL ================= */
        .perfil-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 15, 0.78);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .perfil-modal-overlay.active {
            display: flex;
            animation: fadeInOrg 0.22s ease;
        }

        .perfil-modal-box {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(10, 20, 42, 0.92) 0%, rgba(5, 11, 24, 0.96) 100%);
            border: 1px solid rgba(0, 212, 255, 0.45);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
            padding: 26px 22px 22px 22px;
            text-align: center;
            position: relative;
            color: #fff;
        }

        .modal-close-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .modal-close-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        .modal-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.28);
            margin-bottom: 12px;
        }

        .modal-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.35);
            color: #7dd3fc;
            margin-bottom: 10px;
        }

        .modal-name {
            font-size: 18px;
            font-weight: 900;
            margin: 0 0 4px 0;
        }

        .modal-role {
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            margin: 0 0 14px 0;
        }

        .modal-bio {
            font-size: 12px;
            line-height: 1.55;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 12px 14px;
            margin: 0 0 16px 0;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .modal-contact-row {
            display: flex;
            gap: 8px;
        }

        .btn-ver-equipe-modal {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(0, 212, 255, 0.45);
            background: rgba(0, 212, 255, 0.16);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: all 0.2s ease;
        }
        .btn-ver-equipe-modal:hover {
            background: var(--primary);
            color: #030712;
        }

        /* RESPONSIVO MOBILE */
        @media (max-width: 768px) {
            body:not(.fit-screen-mode) .org-wrapper {
                padding: 80px 12px 75px 12px;
            }
            body.bars-collapsed:not(.fit-screen-mode) .org-wrapper {
                padding: 14px 12px 24px 12px;
            }
            body:not(.fit-screen-mode) .org-level {
                gap: 12px;
            }
            body:not(.fit-screen-mode) .org-card,
            body:not(.fit-screen-mode) .org-card.tier-gold,
            body:not(.fit-screen-mode) .org-card.tier-silver,
            body:not(.fit-screen-mode) .org-card.tier-bronze {
                width: calc(50% - 6px);
                min-width: 156px;
                max-width: 215px;
                min-height: 248px;
                padding: 14px 10px 12px 10px;
            }
            .org-connector-bar {
                width: 90%;
            }
            .btn-contact {
                font-size: 9.5px;
                padding: 6px 4px;
            }
        }

        @media (max-width: 360px) {
            body:not(.fit-screen-mode) .org-card,
            body:not(.fit-screen-mode) .org-card.tier-gold,
            body:not(.fit-screen-mode) .org-card.tier-silver,
            body:not(.fit-screen-mode) .org-card.tier-bronze {
                width: 100%;
                max-width: 245px;
            }
        }
    </style>
</head>

            const container = document.getElementById('organogramaContainer');
            const headerBar = document.getElementById('orgHeaderBar');
            const headerTitle = document.getElementById('orgHeaderTitle');
            const headerSubtitle = document.getElementById('orgHeaderSubtitle');
            const headerIcon = document.getElementById('orgHeaderIcon');
            const btnVoltarGeral = document.getElementById('btnVoltarGeral');
            const navStatus = document.getElementById('navOrgStatus');

            // Controles de Enquadramento e Barras
            const btnToggleFitScreen = document.getElementById('btnToggleFitScreen');
            const iconFitScreen = document.getElementById('iconFitScreen');
            const textFitScreen = document.getElementById('textFitScreen');

            const btnToggleBars = document.getElementById('btnToggleBars');
            const iconToggleBars = document.getElementById('iconToggleBars');
            const textToggleBars = document.getElementById('textToggleBars');

            let isFitScreen = false;
            let areBarsCollapsed = true; // Inicia encolhido conforme solicitado

            // Elementos do Modal
            const modalOverlay = document.getElementById('perfilModalOverlay');
            const btnFecharModal = document.getElementById('btnFecharModal');
            const modalAvatar = document.getElementById('modalAvatar');
            const modalBadge = document.getElementById('modalBadge');
            const modalName = document.getElementById('modalName');
            const modalRole = document.getElementById('modalRole');
            const modalBio = document.getElementById('modalBio');
            const modalWpp = document.getElementById('modalWpp');
            const modalMail = document.getElementById('modalMail');
            const btnModalVerEquipe = document.getElementById('btnModalVerEquipe');

            const REGISTRO_PESSOAS = {};
            let animacaoSequencialId = null;

            // ================= FUNÇÃO DE ENQUADRAMENTO AUTOMÁTICO NA TELA =================
            function aplicarAjusteDeTela() {
                const tree = container.querySelector('.org-tree');
                if (!tree) return;

                // Reset inicial para medição real
                container.style.transform = 'none';
                tree.classList.remove('fit-single-row', 'fit-two-rows');

                if (!isFitScreen) {
                    document.body.classList.remove('fit-screen-mode');
                    return;
                }

                document.body.classList.add('fit-screen-mode');

                // Calcula área disponível na janela descontando cabeçalho e barras (se visíveis)
                const headerRect = headerBar.getBoundingClientRect();
                const topUsed = headerRect.bottom + 14;
                const bottomMargin = areBarsCollapsed ? 18 : 68;
                const availW = window.innerWidth - 36;
                const availH = Math.max(220, window.innerHeight - topUsed - bottomMargin);

                // Testa 1 linha contínua de líderes vs 2 linhas equilibradas e escolhe a que gera maior escala (cards maiores)
                tree.classList.add('fit-single-row');
                const w1 = tree.scrollWidth;
                const h1 = tree.scrollHeight;
                const scale1 = Math.min(availW / w1, availH / h1, 1);

                tree.classList.remove('fit-single-row');
                tree.classList.add('fit-two-rows');
                const w2 = tree.scrollWidth;
                const h2 = tree.scrollHeight;
                const scale2 = Math.min(availW / w2, availH / h2, 1);

                let finalScale = scale1;
                if (scale2 > scale1) {
                    finalScale = scale2;
                } else {
                    tree.classList.remove('fit-two-rows');
                    tree.classList.add('fit-single-row');
                }

                container.style.transform = `scale(${finalScale.toFixed(4)})`;
            }

            // Alternar modo "Ajustar à Tela" vs "Tamanho Original"
            btnToggleFitScreen.addEventListener('click', () => {
                isFitScreen = !isFitScreen;
                if (isFitScreen) {
                    btnToggleFitScreen.classList.add('active-mode');
                    iconFitScreen.className = 'fa-solid fa-expand';
                    textFitScreen.textContent = 'Tamanho Original';
                    window.scrollTo({ top: 0, behavior: 'instant' });
                } else {
                    btnToggleFitScreen.classList.remove('active-mode');
                    iconFitScreen.className = 'fa-solid fa-compress';
                    textFitScreen.textContent = 'Ajustar à Tela';
                }
                aplicarAjusteDeTela();
            });

            // Alternar Navbar e Rodapé Encolhidos vs Visíveis
            btnToggleBars.addEventListener('click', () => {
                areBarsCollapsed = !areBarsCollapsed;
                if (areBarsCollapsed) {
                    document.body.classList.add('bars-collapsed');
                    btnToggleBars.classList.remove('active-mode');
                    iconToggleBars.className = 'fa-solid fa-bars';
                    textToggleBars.textContent = 'Mostrar Menu';
                } else {
                    document.body.classList.remove('bars-collapsed');
                    btnToggleBars.classList.add('active-mode');
                    iconToggleBars.className = 'fa-solid fa-eye-slash';
                    textToggleBars.textContent = 'Ocultar Menu';
                }
                // Recalcula escala caso esteja no modo Ajustar à Tela
                setTimeout(aplicarAjusteDeTela, 50);
            });

            window.addEventListener('resize', () => {
                if (isFitScreen) aplicarAjusteDeTela();
            });

            // ================= ANIMAÇÃO SEQUENCIAL VAI-E-VOLTA NOS CARDS =================
            function iniciarTraçoSequencialPingPong() {
                if (animacaoSequencialId) {
                    cancelAnimationFrame(animacaoSequencialId);
                    animacaoSequencialId = null;
                }

                const cards = Array.from(container.querySelectorAll('.org-card'));
                if (!cards.length) return;

                const rects = cards.map(c => c.querySelector('.card-border-rect'));
                let index = 0;
                let direction = 1;
                let progress = 0;
                let lastTime = null;
                const duracaoPorCardMs = 3200;

                cards.forEach((c, i) => {
                    c.classList.remove('active-trace');
                    if (rects[i]) rects[i].style.strokeDashoffset = '128';
                });

                function step(timestamp) {
                    if (!lastTime) lastTime = timestamp;
                    const delta = timestamp - lastTime;
                    lastTime = timestamp;

                    progress += delta / duracaoPorCardMs;

                    if (progress >= 1) {
                        cards[index].classList.remove('active-trace');
                        rects[index].style.strokeDashoffset = '128';
                        progress = 0;

                        if (cards.length > 1) {
                            if (index === cards.length - 1 && direction === 1) {
                                direction = -1;
                                index = cards.length - 2;
                            } else if (index === 0 && direction === -1) {
                                direction = 1;
                                index = 1;
                            } else {
                                index += direction;
                            }
                        }
                    }

                    const currentCard = cards[index];
                    const currentRect = rects[index];
                    if (currentCard && currentRect) {
                        currentCard.classList.add('active-trace');
                        const offset = direction === 1
                            ? (128 - progress * 128)
                            : (progress * 128);
                        currentRect.style.strokeDashoffset = offset.toFixed(2);
                    }

                    animacaoSequencialId = requestAnimationFrame(step);
                }

                animacaoSequencialId = requestAnimationFrame(step);
            }

            // ================= MODAL DE PERFIL =================
            function abrirModalPessoa(personKey) {
                const info = REGISTRO_PESSOAS[personKey];
                if (!info) return;

                const { pessoa, badgeText, leaderId } = info;
                modalAvatar.src = pessoa.foto;
                modalAvatar.onerror = () => { modalAvatar.src = pessoa.fallbackFoto; };
                modalBadge.textContent = badgeText;
                modalName.textContent = pessoa.nome;
                modalRole.textContent = pessoa.funcao;
                modalBio.textContent = pessoa.descricao;
                modalWpp.href = `https://wa.me/${pessoa.whatsapp}?text=${encodeURIComponent('Olá ' + pessoa.nome + ', tudo bem?')}`;
                modalMail.href = `mailto:${pessoa.email}`;

                if (leaderId) {
                    btnModalVerEquipe.style.display = 'flex';
                    btnModalVerEquipe.onclick = () => {
                        fecharModal();
                        renderizarEquipe(leaderId);
                    };
                } else {
                    btnModalVerEquipe.style.display = 'none';
                }

                modalOverlay.classList.add('active');
            }

            function fecharModal() {
                modalOverlay.classList.remove('active');
            }

            btnFecharModal.addEventListener('click', fecharModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) fecharModal();
            });

            function criarCardHTML(pessoa, opcoes = {}) {
                const { badgeText = '', tierClass = '', isLeader = false, leaderId = '', uniqueKey = '' } = opcoes;
                REGISTRO_PESSOAS[uniqueKey] = { pessoa, badgeText, leaderId: isLeader ? leaderId : null };

                const wppLink = `https://wa.me/${pessoa.whatsapp}?text=${encodeURIComponent('Olá ' + pessoa.nome + ', tudo bem?')}`;
                const mailLink = `mailto:${pessoa.email}`;

                return `
                    <div class="org-card ${tierClass}" data-person-key="${uniqueKey}">
                        <svg class="card-border-svg" aria-hidden="true">
                            <rect class="card-border-rect" x="0.5" y="0.5" width="calc(100% - 1px)" height="calc(100% - 1px)" rx="16" ry="16" pathLength="100"></rect>
                        </svg>

                        <div class="org-card-top">
                            ${badgeText ? `<span class="org-badge" title="${badgeText}">${badgeText}</span>` : ''}
                            <img src="${pessoa.foto}" onerror="this.onerror=null;this.src='${pessoa.fallbackFoto}'" alt="${pessoa.nome}" class="org-avatar">
                            <h3 class="org-name">${pessoa.nome}</h3>
                            <p class="org-role">${pessoa.funcao}</p>
                            <p class="org-desc">${pessoa.descricao}</p>
                        </div>

                        <div class="org-card-bottom">
                            <div class="org-contact-actions">
                                <a href="${wppLink}" target="_blank" class="btn-contact wpp" onclick="event.stopPropagation()">
                                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                                </a>
                                <a href="${mailLink}" class="btn-contact mail" onclick="event.stopPropagation()">
                                    <i class="fa-solid fa-envelope"></i> E-mail
                                </a>
                            </div>

                            <div class="card-footer-actions">
                                <button type="button" class="btn-card-action perfil-btn" data-person-key="${uniqueKey}">
                                    <i class="fa-solid fa-id-card"></i> Perfil
                                </button>
                                ${isLeader ? `
                                    <button type="button" class="btn-card-action equipe-btn" data-leader-id="${leaderId}">
                                        <i class="fa-solid fa-users"></i> Equipe (${pessoa.equipe.length})
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }

            function vincularEventosCards() {
                document.querySelectorAll('.org-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const key = card.getAttribute('data-person-key');
                        abrirModalPessoa(key);
                    });
                });

                document.querySelectorAll('.equipe-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.getAttribute('data-leader-id');
                        renderizarEquipe(id);
                    });
                });
            }

            // RENDERIZA A VISÃO GERAL
            function renderizarGeral() {
                headerTitle.textContent = 'Organograma Geral ELLCA';
                headerSubtitle.textContent = 'Clique no card para ver o perfil ou em "Equipe" para abrir o organograma do setor';
                headerIcon.className = 'fa-solid fa-sitemap';
                navStatus.textContent = 'ESTRUTURA • VISÃO GERAL';
                btnVoltarGeral.style.display = 'none';

                const lideresOrdenados = [...ORGANOGRAMA_DADOS.lideres].sort((a, b) =>
                    a.setor.localeCompare(b.setor, 'pt-BR')
                );

                const htmlLideres = lideresOrdenados.map(lider =>
                    criarCardHTML(lider, {
                        badgeText: lider.setor,
                        isLeader: true,
                        leaderId: lider.id,
                        uniqueKey: `lider_${lider.id}`
                    })
                ).join('');

                container.innerHTML = `
                    <div class="org-tree">
                        <div class="org-level">
                            ${criarCardHTML(ORGANOGRAMA_DADOS.gerenciaContrato, {
                                badgeText: ORGANOGRAMA_DADOS.gerenciaContrato.nivel,
                                tierClass: ORGANOGRAMA_DADOS.gerenciaContrato.tier,
                                uniqueKey: 'top_contrato'
                            })}
                        </div>

                        <div class="org-connector-v"></div>

                        <div class="org-level">
                            ${criarCardHTML(ORGANOGRAMA_DADOS.gerenciaOperacional, {
                                badgeText: ORGANOGRAMA_DADOS.gerenciaOperacional.nivel,
                                tierClass: ORGANOGRAMA_DADOS.gerenciaOperacional.tier,
                                uniqueKey: 'top_operacional'
                            })}
                        </div>

                        <div class="org-connector-v"></div>

                        <div class="org-level">
                            ${criarCardHTML(ORGANOGRAMA_DADOS.coordenacaoOperacional, {
                                badgeText: ORGANOGRAMA_DADOS.coordenacaoOperacional.nivel,
                                tierClass: ORGANOGRAMA_DADOS.coordenacaoOperacional.tier,
                                uniqueKey: 'top_coordenacao'
                            })}
                        </div>

                        <div class="org-connector-v"></div>
                        <div class="org-connector-bar"></div>

                        <div class="org-level">
                            ${htmlLideres}
                        </div>
                    </div>
                `;

                vincularEventosCards();
                iniciarTraçoSequencialPingPong();
                aplicarAjusteDeTela();
            }

            // RENDERIZA O ORGANOGRAMA ESPECÍFICO DA EQUIPE
            function renderizarEquipe(leaderId) {
                const lider = ORGANOGRAMA_DADOS.lideres.find(l => l.id === leaderId);
                if (!lider) return;

                headerTitle.textContent = `Equipe • ${lider.setor}`;
                headerSubtitle.textContent = `Liderança direta de ${lider.nome} (${lider.equipe.length} colaborador${lider.equipe.length > 1 ? 'es' : ''})`;
                headerIcon.className = 'fa-solid fa-users-gear';
                navStatus.textContent = `${lider.setor.toUpperCase()} • EQUIPE`;
                btnVoltarGeral.style.display = 'inline-flex';

                const htmlMembros = lider.equipe.map((membro, idx) =>
                    criarCardHTML(membro, {
                        badgeText: lider.setor,
                        uniqueKey: `membro_${lider.id}_${idx}`
                    })
                ).join('');

                container.innerHTML = `
                    <div class="org-tree">
                        <div class="org-level">
                            ${criarCardHTML(lider, {
                                badgeText: `Líder • ${lider.setor}`,
                                tierClass: 'tier-bronze',
                                uniqueKey: `lider_topo_${lider.id}`
                            })}
                        </div>

                        <div class="org-connector-v"></div>
                        <div class="org-connector-bar"></div>

                        <div class="org-level">
                            ${htmlMembros}
                        </div>
                    </div>
                `;

                vincularEventosCards();
                iniciarTraçoSequencialPingPong();
                aplicarAjusteDeTela();
                if (!isFitScreen) window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            btnVoltarGeral.addEventListener('click', renderizarGeral);

            // Inicializa na visão geral
            renderizarGeral();
